name: PréstamoFácil - Generar APK Android

# Este archivo vive junto a otros workflows de Android en un repo con varios
# proyectos (por eso el nombre no es simplemente "android.yml" — ya lo usa
# otro proyecto). "paths" hace que esta compilación solo se dispare cuando
# cambia algo dentro de PRESTAMOFACIL_DIR o este mismo archivo; ajusta esa
# variable si copias la carpeta prestamofacil-movil con otro nombre o en
# otra ubicación dentro del repo.
env:
  PRESTAMOFACIL_DIR: prestamofacil-movil

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'prestamofacil-movil/**'
      - '.github/workflows/prestamofacil-android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Instala la build de GraalVM de Gluon (necesaria por gluonfx-maven-plugin).
      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Java "normal" para ejecutar Maven; queda antes en el PATH que GraalVM.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: '${{ env.PRESTAMOFACIL_DIR }}/pom.xml'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      # Opcional: si el build falla por un aviso/límite de licencia de Gluon,
      # pide una licencia gratuita para proyecto de código abierto/académico
      # en https://gluonhq.com/programs/free-gluon-licenses/, guárdala como
      # secreto del repo con el nombre GLUON_LICENSE, y descomenta:
      # - name: Gluon License
      #   uses: gluonhq/gluon-build-license@v1
      #   with:
      #     gluon-license: ${{ secrets.GLUON_LICENSE }}

      - name: Run tests (JVM, rápido — falla antes de gastar tiempo en el build nativo)
        working-directory: ${{ env.PRESTAMOFACIL_DIR }}
        run: mvn test

      - name: Build APK
        working-directory: ${{ env.PRESTAMOFACIL_DIR }}
        run: |
          export ANDROID_SDK=$ANDROID_HOME
          mvn -Pandroid gluonfx:build gluonfx:package
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Firma de release (opcional): sin esto, gluonfx:package genera un
          # APK firmado en modo debug — instalable para pruebas, pero no
          # apto para publicar en Play Store.
          # GLUON_ANDROID_KEYSTOREPATH: ${{ steps.android_keystore_file.outputs.filePath }}
          # GLUON_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GLUON_ANDROID_KEYSTORE_PASSWORD }}
          # GLUON_ANDROID_KEYALIAS: ${{ secrets.GLUON_ANDROID_KEYALIAS }}
          # GLUON_ANDROID_KEYALIAS_PASSWORD: ${{ secrets.GLUON_ANDROID_KEYALIAS_PASSWORD }}

      # gluonfx:package delega el empaquetado final en un proceso Gradle
      # externo ("package-task") cuyo stdout/stderr NO se imprime en el log
      # de este job — solo queda escrito en archivos .log dentro de
      # target/gluonfx/. Sin este paso, un fallo de packaging solo deja ver
      # "Process package-task failed with result: 1" sin la causa real.
      - name: Show Gluon package logs on failure
        if: failure()
        working-directory: ${{ env.PRESTAMOFACIL_DIR }}
        run: |
          echo "Buscando logs de gluonfx..."
          find target/gluonfx -type f -name "*.log" -print0 | while IFS= read -r -d '' f; do
            echo "===== $f ====="
            cat "$f"
            echo
          done
          for f in target/gluonfx/aarch64-android/gensrc/android/AndroidManifest.xml target/gluonfx/aarch64-android/gvm/android_project/app/src/main/AndroidManifest.xml; do
            echo "===== $f ====="
            cat "$f" 2>/dev/null || echo "(no existe)"
            echo
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prestamofacil-apk
          path: ${{ env.PRESTAMOFACIL_DIR }}/target/gluonfx/aarch64-android/gvm/*.apk
          if-no-files-found: error
